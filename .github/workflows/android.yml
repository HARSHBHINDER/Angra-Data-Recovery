name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No wrapper jar is committed, so Gradle comes from the action instead.
      # Pinned: Gradle 9.6.0 removed an internal API that AGP 8.x still relies on,
      # so an unpinned "latest" breaks the build. Bump only alongside AGP.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      # Stable filename so the README's download button never breaks across releases.
      - name: Rename APK
        run: mv app/build/outputs/apk/release/*.apk AngraDataRecovery.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AngraDataRecovery-apk
          path: AngraDataRecovery.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Angra Data Recovery v1.0.${{ github.run_number }}
          files: AngraDataRecovery.apk
          generate_release_notes: true
